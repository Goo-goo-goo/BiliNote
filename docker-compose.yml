
# 单服务部署：FastAPI 一个端口提供纯 Python API（根路径 / 返回健康信息）。
# 唯一数据挂载 ./data:/app/data —— 数据库/配置/截图/上传/笔记/模型全在其下自动创建。
services:
  backend:
    container_name: bilinote-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 国内拉不到 docker.io 时设置 BASE_REGISTRY=docker.m.daocloud.io（或其他可用镜像）
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - BACKEND_HOST=${BACKEND_HOST}
      - DATA_DIR=/app/data
    ports:
      - "${APP_PORT}:${BACKEND_PORT}"
    volumes:
      # 唯一挂载：所有持久化数据都在 /app/data 下（启动时自动建子目录）：
      #   bili_note.db        — SQLite 数据库（含 LLM 供应商配置、笔记历史）
      #   config/             — 转写器/代理/Cookie/自定义 whisper 模型配置
      #   uploads/            — 上传的本地视频
      #   static/screenshots/ — 视频截图；static/cover/ — 封面
      #   note_results/       — 任务笔记与缓存；vector_db/ — RAG 向量索引
      #   downloads/          — 音视频下载缓存；models/ — whisper 模型
      - ./data:/app/data
    # 用 unless-stopped 而非 on-failure:N，避免任何短暂崩溃把容器永久打死后
    # 再也接收不到用户修过的 .env。手动 docker-compose stop 仍可正常停下。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/api/sys_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # WHISPER_MODEL_SIZE 选 medium 及以上请把这里调到 8g+，
    # 否则首次模型加载时容易被 host OOM-killer 干掉。
    mem_limit: 4g
